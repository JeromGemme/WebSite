<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Tally Counter</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="app-container">
        
        <!-- MAXIMUM SECTION -->
        <div class="card">
            <label class="section-title" for="max-input">MAXIMUM</label>
            <div class="input-group">
                <input type="number" id="max-input" placeholder="Restart count at..." min="1">
            </div>
        </div>

        <!-- AUTO-INCREMENT SECTION -->
        <div class="card">
            <label class="section-title">AUTO - INCREMENT</label>
            <div class="auto-row">
                <div class="input-col">
                    <label for="auto-amount">Amount (+)</label>
                    <input type="number" id="auto-amount" placeholder="Qty" value="1" min="1">
                </div>
                <div class="input-col">
                    <label for="auto-time">Time Loop (Sec)</label>
                    <input type="number" id="auto-time" placeholder="Seconds" value="1" min="0.1" step="0.1">
                </div>
            </div>
            <button id="toggle-auto" class="btn-primary">Start Auto-Loop</button>
        </div>

        <!-- TALLY DISPLAY SECTION -->
        <div class="tally-display">
            <div class="actual-number" id="actual-number">5</div>
            <div class="tally-marks" id="tally-marks">( X X X X X )</div>
        </div>

        <!-- MANUAL CONTROLS SECTION -->
        <div class="controls">
            <button id="btn-minus" class="control-btn minus">-</button>
            <button id="btn-plus" class="control-btn plus">+</button>
        </div>
        
        <!-- INCREMENT AMOUNT SETTING -->
        <div class="increment-settings">
            <label for="step-input">Increment Amount (+/-)</label>
            <input type="number" id="step-input" value="1" min="1">
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
